name: Sandbox checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SANDBOX_API_KEY: ci-sandbox-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/smoke.py
      - run: docker compose up --build -d --wait
      - run: uv run python scripts/verify_running.py --reset --receipt-file /tmp/sandbox-receipt.json
      - run: docker compose restart && docker compose up -d --wait
      - run: uv run python scripts/verify_running.py --receipt-file /tmp/sandbox-receipt.json
      - if: always()
        run: docker compose down -v
